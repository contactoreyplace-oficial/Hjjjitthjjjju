<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#064e3b" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#06090d" stop-opacity="1"/>
    </radialGradient>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="50%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>
    <linearGradient id="lensRing" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#065f46"/>
    </linearGradient>
  </defs>

  <!-- Dark tactical background -->
  <rect width="512" height="512" rx="104" fill="#06090d"/>
  <circle cx="256" cy="256" r="230" fill="url(#bgGlow)"/>

  <!-- Tactical Radar Rings -->
  <circle cx="256" cy="256" r="190" fill="none" stroke="#10b981" stroke-width="2" stroke-opacity="0.25" stroke-dasharray="8 8"/>
  <circle cx="256" cy="256" r="140" fill="none" stroke="#10b981" stroke-width="2" stroke-opacity="0.35"/>
  <circle cx="256" cy="256" r="85" fill="none" stroke="#34d399" stroke-width="3" stroke-opacity="0.6"/>

  <!-- Tactical Crosshair Axes -->
  <line x1="256" y1="46" x2="256" y2="466" stroke="#10b981" stroke-width="2" stroke-opacity="0.3"/>
  <line x1="46" y1="256" x2="466" y2="256" stroke="#10b981" stroke-width="2" stroke-opacity="0.3"/>

  <!-- Outer Protective Shield -->
  <path d="M 256 95 L 375 145 C 375 275 256 385 256 385 C 256 385 137 275 137 145 Z" 
        fill="#041f17" stroke="url(#shieldGrad)" stroke-width="12" stroke-linejoin="round"/>

  <!-- Camera Body & Night Vision Lens Core -->
  <circle cx="256" cy="235" r="62" fill="#02140e" stroke="url(#lensRing)" stroke-width="8"/>
  <circle cx="256" cy="235" r="42" fill="#092d22" stroke="#10b981" stroke-width="4"/>
  <circle cx="256" cy="235" r="24" fill="#10b981"/>
  <circle cx="244" cy="223" r="8" fill="#ffffff" opacity="0.8"/>

  <!-- Corner Brackets -->
  <path d="M 90 140 L 90 90 L 140 90" fill="none" stroke="#10b981" stroke-width="8" stroke-linecap="round"/>
  <path d="M 422 140 L 422 90 L 372 90" fill="none" stroke="#10b981" stroke-width="8" stroke-linecap="round"/>
  <path d="M 90 372 L 90 422 L 140 422" fill="none" stroke="#10b981" stroke-width="8" stroke-linecap="round"/>
  <path d="M 422 372 L 422 422 L 372 422" fill="none" stroke="#10b981" stroke-width="8" stroke-linecap="round"/>

  <!-- Pulsing Red Spy Cam Indicator -->
  <circle cx="345" cy="185" r="10" fill="#ef4444"/>
  <circle cx="345" cy="185" r="16" fill="none" stroke="#ef4444" stroke-width="2" opacity="0.6"/>
</svg>
